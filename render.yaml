services:
  - type: web
    name: zenithmax-v29-v6-staging
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/ready
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_SECRET
        generateValue: true
      - key: CEO_EMAILS
        value: zenitholuwambe5@gmail.com
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_PROVIDER
        value: postgres
      - key: MEDIA_STORAGE_PROVIDER
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "false"
      - key: MEDIA_CDN_BASE_URL
        sync: false
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: APP_PUBLIC_URL
        sync: false
      - key: PAYMENTS_PROVIDER
        value: stripe
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: TURN_URLS
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false

      - key: RELEASE_CHANNEL
        value: stable
      # Creator payments are not live. Keep this false so the demo ledger cannot show fake earnings.
      - key: ENABLE_DEMO_MONETIZATION
        value: "false"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: PGSSL_REJECT_UNAUTHORIZED
        value: "false"
      # Optional: enable dynamic YouTube discovery without rehosting YouTube media.
      - key: YOUTUBE_API_KEY
        sync: false
